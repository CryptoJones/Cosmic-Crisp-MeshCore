name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meshcorekit:
    name: MeshCoreKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/MeshCoreKit
        run: swift test

  app:
    name: App (iPad simulator + device build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | test("iPad")))] | sort_by(.name) | reverse | .[0].udid')
          test -n "$UDID" && test "$UDID" != "null"
          echo "picked: $(xcrun simctl list devices available | grep "$UDID")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test (simulator)
        run: |
          set -o pipefail
          xcodebuild -project Cosmic-Crisp-MeshCore.xcodeproj -scheme CosmicCrisp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test | xcpretty
      - name: Build (generic iOS device — compiles the USB transport + dext)
        run: |
          set -o pipefail
          xcodebuild -project Cosmic-Crisp-MeshCore.xcodeproj -scheme CosmicCrisp \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
