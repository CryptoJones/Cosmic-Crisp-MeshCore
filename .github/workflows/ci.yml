name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meshcorekit:
    name: MeshCoreKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/MeshCoreKit
        run: swift test

  app:
    name: App (iPad simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # The image's default Xcode is the one whose iOS simulator runtime is
        # actually installed. Xcode 16.2 is still present but its iOS 18.2 runtime
        # is not (seen 2026-10-20), and downloading one fails on the runner.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: List simulator runtimes
        run: xcrun simctl list runtimes
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & test (simulator)
        run: |
          set -o pipefail
          xcodebuild -project Cosmic-Crisp-MeshCore.xcodeproj -scheme CosmicCrisp \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M4)' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test | xcpretty
